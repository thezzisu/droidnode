name: Publish to npm

# Publishes via npm's Trusted Publisher (OIDC) — no NPM_TOKEN needed.
# Set up once at https://www.npmjs.com/package/@thezzisu/droidnode/access
# (or before first publish: https://www.npmjs.com/settings/<user>/trusted-publishers):
#   Publisher: GitHub Actions
#   Organization / repository: thezzisu / droidnode
#   Workflow filename: publish.yml
#   Environment: (leave blank, or "release" if you add one)
# After that, every tag push hits npm with an OIDC-signed publish.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from (defaults to current)
        required: false
      dry-run:
        description: Skip the actual publish (validate OIDC + pack only)
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # for `gh release create`
  id-token: write   # for OIDC token exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'                       # ships with npm 11.x
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure OIDC-capable npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Smoke before publish
        run: node scripts/smoke.js

      - name: Tag / package.json version match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: npm publish (OIDC, with provenance)
        if: ${{ !inputs.dry-run }}
        run: npm publish --access public --provenance

      - name: Ensure GitHub release exists
        if: ${{ !inputs.dry-run && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping create"
          else
            DROID_VER=$(node -p "require('./package.json').dependencies.droid.replace(/^[\^~]/,'')")
            gh release create "$TAG" \
              --title "$TAG — pinned to droid@$DROID_VER" \
              --notes "Published from CI via npm Trusted Publisher OIDC. Provenance attestation: https://www.npmjs.com/package/@thezzisu/droidnode/v/${TAG#v}"
          fi

      - name: Dry-run pack
        if: ${{ inputs.dry-run }}
        run: |
          npm pack --dry-run
          echo "OIDC token claims:"
          curl -sSLf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
               "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" \
            | cut -d. -f2 | base64 -d 2>/dev/null || true
