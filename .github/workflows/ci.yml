name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: Extract + version smoke against pinned droid
        run: node scripts/smoke.js
      - name: Verify launcher resolves npm-installed droid
        run: |
          OUT=$(node bin/droidnode.js --print-paths)
          echo "$OUT"
          echo "$OUT" | grep -q '"source": "droid npm package"'
